# -----------------------------------------------------------------------------
# Site
# -----------------------------------------------------------------------------

title: Gorav Jindal
description: >-
  Gorav Jindal is a postdoctoral researcher in the Algorithms and Complexity
  Theory group at the University of Regensburg, working on algebraic complexity
  theory, computational complexity, and formal power series.
url: https://goravjindal.github.io
baseurl: ""
lang: en
timezone: Europe/Berlin

author:
  name: Gorav Jindal
  first_name: Gorav
  last_name: Jindal
  email: gorav.jindal@gmail.com
  position: Postdoctoral Researcher
  affiliation: University of Regensburg
  location: Regensburg, Germany

# -----------------------------------------------------------------------------
# Build
# -----------------------------------------------------------------------------

markdown: kramdown
permalink: /:title/

plugins:
  - jekyll-scholar
  - jekyll-sitemap

scholar:
  last_name: [Jindal]
  first_name: [Gorav]
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [smallcaps, superscript]
  replace_strings: true
  join_strings: true
  query: "@*"
  sort_by: year
  order: descending
  group_by: year
  group_order: descending

include:
  - _pages

exclude:
  - archive
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .jekyll-cache
  - node_modules
