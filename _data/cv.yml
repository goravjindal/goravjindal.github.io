- title: Research Summary
  type: text
  contents: >
    My broad research interests lie within theoretical computer science and complexity theory,
    with a focus on algebraic complexity theory and computer algebra. I explore various algebraic
    models of computation and have recently begun investigating the theoretical foundations of
    linear dynamical systems.

