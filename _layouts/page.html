---
layout: default
---
<div class="wrap page{% if page.wide %} page--wide{% endif %}">
  <header class="page-header">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="page-description">{{ page.description }}</p>{% endif %}
  </header>

  <div class="prose">
    {{ content }}
  </div>
</div>
